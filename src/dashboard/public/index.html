<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO - اصنع خادم ديسكورد احترافي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            color: #fff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- الهيدر (Navbar) مطابق لتصميم ProBot -->
    <header class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto w-full">

        <!-- اليسار: صورة البروفايل أو زر الدخول -->
        <div class="flex items-center gap-4">
            <div
                class="w-10 h-10 rounded-full bg-gray-800 border border-gray-700 overflow-hidden flex items-center justify-center">
                <!-- استبدلها بصورة بروفايل المستخدم أو أيقونة -->
                <span class="text-xs text-gray-400 font-bold">Z</span>
            </div>
        </div>

        <!-- المنتصف: القوائم (المميزات، المصادر، بريميوم) -->
        <nav class="hidden md:flex items-center gap-8 text-sm text-gray-300 font-medium">
            <a href="#" class="hover:text-indigo-400 transition flex items-center gap-1">
                <span>المميزات</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </a>
            <a href="#" class="hover:text-indigo-400 transition flex items-center gap-1">
                <span>المصادر</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </a>
            <a href="#" class="hover:text-amber-400 transition flex items-center gap-1.5 text-amber-400 font-semibold">
                <span>✨ بريميوم</span>
            </a>
        </nav>

        <!-- اليمين: شعار ZENO -->
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-wider">ZENO</span>
            <div
                class="bg-indigo-600 p-2 rounded-xl text-lg font-black shadow-lg shadow-indigo-600/30 flex items-center justify-center w-10 h-10">
                Z</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي (Hero Section) -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 py-16">
        <!-- شارة التحديث العلوي -->
        <div
            class="inline-block bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-4 py-1.5 rounded-full mb-8 border border-indigo-500/20">
            جديد: نظام التذاكر المطور
        </div>

        <!-- العنوان الرئيسي الضخم -->
        <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6 max-w-3xl leading-tight">
            اصنع خادم ديسكورد <br class="hidden md:block"> احترافي!
        </h1>

        <!-- الوصف -->
        <p class="text-gray-400 text-sm md:text-base max-w-xl mb-12 leading-relaxed">
            بوت متعدد الأغراض قابل للتخصيص جداً حيث يوفر لك تخصيص صورة كرسالة ترحيبية وسجلات متعمقة وأوامر اجتماعية
            وإشراف وأكثر...
        </p>

        <!-- الأزرار (عكس الترتيب لتكون مطابقة: لوحة التحكم يمين، إضافة البوت يسار حسب اتجاه الـ RTL) -->
        <div class="flex flex-wrap items-center justify-center gap-4">
            <a href="/dashboard"
                class="px-8 py-3.5 rounded-xl bg-gray-800 hover:bg-gray-700 transition font-bold border border-gray-700/50 text-sm">
                لوحة التحكم
            </a>
            <a href="#"
                class="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-bold shadow-xl shadow-indigo-600/30 text-sm">
                إضافة البوت في Discord
            </a>
        </div>
    </main>

    <!-- فوتر بسيط -->
    <footer class="py-6 text-center text-gray-600 text-xs">
        <!-- مساحة فارغة سفلية مطابقة للصورة -->
    </footer>

</body>

</html>
