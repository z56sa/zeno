<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO BOT - صنع خادم ديسكورد احترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #060911;
            color: #fff;
        }

        .bg-glow {
            background:
                radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 45%);
        }

        /* تأثير الحركة للزر الرئيسي */
        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.4), 0 0 40px rgba(99, 102, 241, 0.2);
            }

            50% {
                box-shadow: 0 0 35px rgba(99, 102, 241, 0.7), 0 0 60px rgba(139, 92, 246, 0.4);
            }
        }

        .btn-animated {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        /* لمعان خطي متحرك */
        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.15) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shimmerMove 4s infinite;
        }

        @keyframes shimmerMove {
            0% {
                transform: translate(-100%, -100%) rotate(30deg);
            }

            100% {
                transform: translate(100%, 100%) rotate(30deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between bg-glow">

    <!-- Header Navigation -->
    <header class="max-w-7xl mx-auto w-full px-8 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-600/30">
                Z</div>
            <span class="text-2xl font-black tracking-wider">ZENO</span>
        </div>

        <nav class="hidden md:flex items-center gap-8 text-sm font-bold text-gray-300">
            <a href="#features" class="hover:text-indigo-400 transition">المميزات</a>
            <a href="https://discord.gg" target="_blank" class="hover:text-indigo-400 transition">سيرفر الدعم</a>
        </nav>

        <!-- زر تسجيل الدخول في الهيدر -->
        <div id="authNavContainer">
            <a id="navAuthBtn" href="/auth/discord"
                class="shimmer flex items-center gap-2.5 px-5 py-2.5 rounded-2xl bg-[#5865F2] hover:bg-[#4752C4] text-white text-xs font-black transition-all transform hover:scale-105 shadow-lg shadow-[#5865F2]/30 active:scale-95">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 127.14 96.36">
                    <path
                        d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,3.36,6.83A97.68,97.68,0,0,0,42.27,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a73.57,73.57,0,0,0,64.32,0c.87.68,1.75,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77.5,77.5,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53S36,40.31,42.45,40.31C48.92,40.31,54,46,53.9,53S48.92,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.08-12.69,11.44-12.69C91.13,40.31,96.2,46,96.1,53S91.13,65.69,84.69,65.69Z" />
                </svg>
                <span>تسجيل الدخول</span>
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="max-w-4xl mx-auto w-full px-6 text-center my-auto py-12">
        <div
            class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold mb-8 backdrop-blur-md">
            <span>✨ جديد: لوحة تحكم متطورة لإدارة سيرفرك</span>
        </div>

        <h1 class="text-4xl md:text-6xl font-black text-white leading-tight mb-6">
            اصنع خادم ديسكورد <br><span
                class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">احترافي!</span>
        </h1>

        <p class="text-gray-400 text-sm md:text-base leading-relaxed max-w-xl mx-auto mb-10">
            بوت متعدد الأغراض قابل للتخصيص بالكامل لتوفير نظام التذاكر، الإشراف، الترحيب وأوامر إدارية متقدمة.
        </p>

        <!-- الأزرار التفاعلية -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <!-- زر إضافة البوت -->
            <a href="https://discord.com/oauth2/authorize?client_id=1506005273893146775&permissions=8&scope=bot%20applications.commands"
                target="_blank"
                class="btn-animated shimmer w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white rounded-2xl text-sm font-black transition-all active:scale-95 flex items-center justify-center gap-2">
                <span>إضافة البوت في Discord</span>
            </a>

            <!-- زر لوحة التحكم -->
            <a href="/dashboard"
                class="w-full sm:w-auto px-8 py-4 bg-[#0f1523]/80 hover:bg-[#151c30] border border-gray-800 hover:border-indigo-500/50 text-gray-200 hover:text-white rounded-2xl text-sm font-black transition-all duration-300 backdrop-blur-md hover:shadow-xl hover:shadow-indigo-500/10 active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>لوحة التحكم</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-500 text-xs border-t border-gray-800/40">
        جميع الحقوق محفوظة © ZENO BOT 2026 - <a href="https://discord.gg" class="hover:text-indigo-400">سيرفر الدعم</a>
    </footer>

    <!-- Script للتحقق من تسجيل الدخول وتغيير الزر تلقائياً -->
    <script>
        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated && data.user) {
                    const container = document.getElementById('authNavContainer');
                    const user = data.user;
                    const avatarUrl = user.avatar
                        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                        : 'https://cdn.discordapp.com/embed/avatars/0.png';

                    container.innerHTML = `
                        <a href="/dashboard" class="flex items-center gap-3 bg-[#0f1523] border border-indigo-500/30 hover:border-indigo-500 px-4 py-2 rounded-2xl transition-all duration-300 hover:shadow-lg hover:shadow-indigo-500/20 group">
                            <img src="${avatarUrl}" class="w-7 h-7 rounded-xl object-cover border border-indigo-400 group-hover:scale-105 transition-transform">
                            <span class="text-xs font-bold text-gray-200 group-hover:text-indigo-300">${user.username}</span>
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </a>
                    `;
                }
            })
            .catch(() => { });
    </script>
</body>

</html>
