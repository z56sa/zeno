<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO BOT - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            background-color: #08080a !important;
            color: #ffffff !important;
            font-family: 'Cairo', sans-serif !important;
            margin: 0;
            padding: 0;
        }

        .purple-glow {
            background: radial-gradient(circle at 50% 25%, rgba(168, 85, 247, 0.18), transparent 65%);
        }

        .glass-box {
            background-color: #12121a !important;
            border: 1px solid #232334 !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between purple-glow"
    style="background-color: #08080a !important; color: #ffffff !important;">

    <!-- Navbar Menu -->
    <header class="bg-[#0b0b10]/95 border-b border-[#1f1f2e] sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

            <!-- Logo & Title (Grouped Correctly for RTL) -->
            <!-- Navbar Menu -->
            <header class="bg-[#0b0b10]/95 border-b border-[#1f1f2e] sticky top-0 z-50 backdrop-blur-md">
                <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">

                    <!-- Login / Dashboard Button (في اليمين لأن اللغة عربي RTL) -->
                    <div>
                        <a href="/dashboard"
                            class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-purple-600/30">
                            تسجيل الدخول
                        </a>
                    </div>

                    <!-- Nav Links (في المنتصف) -->
                    <nav class="hidden md:flex items-center gap-8 text-xs font-bold text-gray-400">
                        <a href="#features" class="hover:text-purple-400 transition">المميزات</a>
                        <a href="https://discord.gg" target="_blank" class="hover:text-purple-400 transition">سيرفر
                            الدعم</a>
                    </nav>

                    <!-- Logo & Title (في اليسار) -->
                    <a href="/" class="flex items-center gap-3 group">
                        <span class="text-xl font-black tracking-[0.25em] text-white">Z E N O</span>
                        <div
                            class="w-10 h-10 rounded-full overflow-hidden border-2 border-purple-500/50 shadow-lg shadow-purple-600/30 flex items-center justify-center bg-[#12121a]">
                            <img src="/logo.png" alt="ZENO" class="w-full h-full object-cover">
                        </div>
                    </a>

                </div>
            </header>

            <!-- Hero Section -->
            <main class="max-w-4xl mx-auto px-6 py-20 text-center flex-1 flex flex-col items-center justify-center">

                <div
                    class="inline-flex items-center gap-2 bg-[#181824] border border-purple-500/30 px-4 py-1.5 rounded-full text-xs font-bold text-purple-300 mb-6 shadow-md">
                    <span>✨</span>
                    <span>جديد: لوحة تحكم متطورة لإدارة سيرفرك</span>
                </div>

                <h1 class="text-4xl md:text-6xl font-black text-white leading-tight mb-6">
                    اصنع خادم ديسكورد <span class="text-purple-400">احترافي!</span>
                </h1>

                <p class="text-gray-300 text-sm md:text-base leading-relaxed max-w-2xl mb-10 font-semibold">
                    بوت متعدد الأغراض قابل للتخصيص بالكامل لتوفير نظام التذاكر، الإشراف، الترحيب وأوامر إدارية متقدمة.
                </p>

                <div class="flex flex-wrap items-center justify-center gap-4">
                    <a href="https://discord.com/api/oauth2/authorize?client_id=1506005273893146775&permissions=8&scope=bot%20applications.commands"
                        target="_blank"
                        class="px-8 py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-sm transition-all shadow-xl shadow-purple-600/30 hover:scale-105">
                        إضافة البوت في Discord
                    </a>
                    <a href="/dashboard"
                        class="px-8 py-3.5 glass-box hover:bg-[#1a1a26] text-white font-bold rounded-xl text-sm transition-all hover:scale-105">
                        لوحة التحكم
                    </a>
                </div>
            </main>

            <!-- Footer -->
            <footer class="border-t border-[#1f1f2e] bg-[#060608] py-6 text-center text-gray-400 text-xs font-semibold">
                جميع الحقوق محفوظة © ZENO BOT 2026 - سيرفر الدعم
            </footer>

</body>

</html>
