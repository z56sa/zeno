<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENO - اصنع خادم ديسكورد احترافي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            color: #fff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- الهيدر (Navbar) -->
    <header class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto w-full">

        <!-- اليسار: زر تسجيل الدخول بحساب ديسكورد -->
        <div class="flex items-center gap-4">
            <a href="/auth/discord"
                class="flex items-center gap-2.5 px-4 py-2 rounded-xl bg-[#5865F2]/10 hover:bg-[#5865F2]/20 border border-[#5865F2]/30 text-[#5865F2] hover:text-white transition text-xs font-bold shadow-lg">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 127.14 96.36">
                    <path
                        d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.65-27.28-4.51-51.19-18.9-72.15ZM42.45,65.69c-6.18,0-11.28-5.7-11.28-12.7s5.09-12.7,11.28-12.7c6.28,0,11.38,5.72,11.28,12.7C53.73,60,48.74,65.69,42.45,65.69Zm42.24,0c-6.18,0-11.28-5.7-11.28-12.7s5.09-12.7,11.28-12.7c6.28,0,11.38,5.72,11.28,12.7C95.97,60,91,65.69,84.69,65.69Z" />
                </svg>
                <span>تسجيل الدخول</span>
            </a>
        </div>

        <!-- المنتصف: القوائم (تم إزالة بريميوم) -->
        <nav class="hidden md:flex items-center gap-8 text-sm text-gray-300 font-medium">
            <a href="#" class="hover:text-indigo-400 transition flex items-center gap-1">
                <span>المميزات</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </a>
            <a href="#" class="hover:text-indigo-400 transition flex items-center gap-1">
                <span>المصادر</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </a>
        </nav>

        <!-- اليمين: شعار ZENO -->
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-wider">ZENO</span>
            <div
                class="bg-indigo-600 p-2 rounded-xl text-lg font-black shadow-lg shadow-indigo-600/30 flex items-center justify-center w-10 h-10">
                Z</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 py-16">
        <div
            class="inline-block bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-4 py-1.5 rounded-full mb-8 border border-indigo-500/20">
            جديد: نظام التذاكر المطور
        </div>

        <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6 max-w-3xl leading-tight">
            اصنع خادم ديسكورد <br class="hidden md:block"> احترافي!
        </h1>

        <p class="text-gray-400 text-sm md:text-base max-w-xl mb-12 leading-relaxed">
            بوت متعدد الأغراض قابل للتخصيص جداً حيث يوفر لك تخصيص صورة كرسالة ترحيبية وسجلات متعمقة وأوامر اجتماعية
            وإشراف وأكثر...
        </p>

        <div class="flex flex-wrap items-center justify-center gap-4">
            <!-- زر لوحة التحكم الحقيقي -->
            <a href="/dashboard"
                class="px-8 py-3.5 rounded-xl bg-gray-800 hover:bg-gray-700 transition font-bold border border-gray-700/50 text-sm shadow-md">
                لوحة التحكم
            </a>
            <a href="https://discord.com/oauth2/authorize..." target="_blank"
                class="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition font-bold shadow-xl shadow-indigo-600/30 text-sm">
                إضافة البوت في Discord
            </a>
        </div>
    </main>

    <footer class="py-6 text-center text-gray-600 text-xs"></footer>

</body>

</html>
